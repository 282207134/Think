name: think_app
description: Flutter implementation of all 120 Think UI Kit screens from Pixso.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.4
dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  path_drawing: ^1.0.1
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/design/
    - assets/fonts/OFL-Montserrat.txt
    - assets/fonts/OFL-DancingScript.txt
    - assets/fonts/OFL-BebasNeue.txt
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
          weight: 500
        - asset: assets/fonts/Montserrat.ttf
          weight: 700
    - family: Bebas Neue
      fonts:
        - asset: assets/fonts/BebasNeue.ttf
    - family: Dancing Script
      fonts:
        - asset: assets/fonts/DancingScript.ttf
          weight: 700
